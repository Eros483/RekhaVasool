{% extends "base.html" %}
{% block title %}FreshMart — RekhaVasool{% endblock %}
{% block content %}
<div class="card">
  <h1>Set your spending limit</h1>
  <p class="muted">Approve a signed limit for FreshMart — the agent can only spend up to this.</p>
  <form method="post" action="/approve">
    <div style="margin-bottom:8px"><label>Your name: <input type="text" name="user_id" value="u_42" size="12"></label></div>
    <div style="margin-bottom:8px"><label>Limit (₹): <input type="number" name="max_amount" value="5000" min="100" step="100" size="10"></label></div>
    <div style="margin-bottom:8px"><label>Valid for (minutes): <input type="number" name="minutes" value="15" min="1" size="6"></label></div>
    <button type="submit">Approve & continue</button>
  </form>
</div>
{% endblock %}
