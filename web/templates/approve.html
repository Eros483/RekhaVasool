{% extends "base.html" %}
{% block title %}Approved — RekhaVasool{% endblock %}
{% block content %}
<div class="card">
  <h1>Agent is approved</h1>
  <table>
    <tr><th>Spending limit</th><td>{{ mandate.max_amount | inr }}</td></tr>
    <tr><th>Store</th><td>{{ mandate.allowlist | join(", ") }}</td></tr>
    <tr><th>Expires</th><td>{{ mandate.expiry }}</td></tr>
  </table>
  <form method="post" action="/shop">
    <input type="hidden" name="mandate_token" value="{{ token }}">
    <button type="submit">Continue to shop →</button>
  </form>
</div>
<p><a href="/">← start over</a></p>
{% endblock %}
