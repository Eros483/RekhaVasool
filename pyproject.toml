[project]
name = "rekhavasool"
version = "0.1.0"
description = "Guarded agentic checkout + recovery"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "google-generativeai>=0.5",
  "gTTS>=2.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["test_*.py", "harness.py"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
  "pytest>=8",
  "black>=24",
  "ruff>=0.6",
  "httpx>=0.27",
]
